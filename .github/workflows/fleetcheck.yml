name: fleetcheck

# Lints this repo against iSimplifyMe fleet rules + security checks.
# BLOCKING: findings at error/security severity fail CI. `fleetcheck` is a
# required status check on main — this workflow is what reports it. Every
# earlier attempt (PRs #5/#6/#7) died at "Set up job": this repo is PUBLIC
# and a public repo cannot resolve a PRIVATE repo's action, regardless of
# pin or access settings. Fixed 2026-07-29 by taking fleetcheck public
# (after a history sanitize that re-cut v0.2.0 as ed3aa98f). The dead gate
# had Drift Sentinel gate-availability red since 2026-07-26.
# Refs pinned per the fleet no-floating-refs standard.
on:
  pull_request:

jobs:
  fleetcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: fleetcheck
        uses: iSimplifyMe/fleetcheck@ed3aa98faafa45fc2b5baa0f5f99b57a4ba7290f # v0.2.0
        with:
          fail-on: error
